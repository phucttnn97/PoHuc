<canvas id="stage"></canvas>
<button id="start" type="button" aria-label="Bắt đầu đếm ngược sinh nhật"></button>

<script>
(function () {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0, DPR = 1;
  let centerX = 0, centerY = 0, heartScale = 1;

  // --- Parametric heart curve, sampled and re-centered numerically ---
  // Returns a raw (unscaled, unflipped) point on the classic heart curve.
  function rawHeartPoint(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return [x, -y]; // flip y so the shape sits point-down in canvas space
  }

  let heartOffset = { x: 0, y: 0 };
  (function computeHeartOffset() {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (let i = 0; i <= 400; i++) {
      const t = (i / 400) * Math.PI * 2;
      const [x, y] = rawHeartPoint(t);
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
    }
    heartOffset = { x: (minX + maxX) / 2, y: (minY + maxY) / 2 };
  })();

  function heartLocal(t, u) {
    const [x, y] = rawHeartPoint(t);
    return [(x - heartOffset.x) * u, (y - heartOffset.y) * u];
  }

  // Boundary polygon (u=1) used to test whether a point lies inside the heart,
  // so particles can be scattered uniformly by area instead of radially from the origin.
  const HEART_POLY = (() => {
    const pts = [];
    for (let i = 0; i < 240; i++) {
      pts.push(heartLocal((i / 240) * Math.PI * 2, 1));
    }
    return pts;
  })();
  const HEART_BOUNDS = (() => {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const [x, y] of HEART_POLY) {
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
    }
    return { minX, maxX, minY, maxY };
  })();
  function pointInHeart(px, py) {
    let inside = false;
    for (let i = 0, j = HEART_POLY.length - 1; i < HEART_POLY.length; j = i++) {
      const [xi, yi] = HEART_POLY[i];
      const [xj, yj] = HEART_POLY[j];
      const intersects = (yi > py) !== (yj > py) &&
        px < (xj - xi) * (py - yi) / (yj - yi) + xi;
      if (intersects) inside = !inside;
    }
    return inside;
  }

  // Distance from the origin to the heart's boundary at a given angle, via ray casting.
  // Lets the cursor's "hole" follow the heart's outline instead of a plain circle.
  function raySegmentDist(dx, dy, ax, ay, bx, by) {
    const v1x = -ax, v1y = -ay;
    const v2x = bx - ax, v2y = by - ay;
    const v3x = -dy, v3y = dx;
    const dot = v2x * v3x + v2y * v3y;
    if (Math.abs(dot) < 1e-9) return null;
    const t1 = (v2x * v1y - v2y * v1x) / dot;
    const t2 = (v1x * v3x + v1y * v3y) / dot;
    if (t1 >= 0 && t2 >= 0 && t2 <= 1) return t1;
    return null;
  }
  const BOUNDARY_STEPS = 360;
  const BOUNDARY_TABLE = (() => {
    const table = new Float32Array(BOUNDARY_STEPS);
    for (let i = 0; i < BOUNDARY_STEPS; i++) {
      const angle = (i / BOUNDARY_STEPS) * Math.PI * 2;
      const dx = Math.cos(angle), dy = Math.sin(angle);
      let minT = Infinity;
      for (let j = 0; j < HEART_POLY.length; j++) {
        const [ax, ay] = HEART_POLY[j];
        const [bx, by] = HEART_POLY[(j + 1) % HEART_POLY.length];
        const t = raySegmentDist(dx, dy, ax, ay, bx, by);
        if (t !== null && t < minT) minT = t;
      }
      table[i] = isFinite(minT) ? minT : 10;
    }
    return table;
  })();
  function heartBoundaryRadius(angle) {
    let a = angle % (Math.PI * 2);
    if (a < 0) a += Math.PI * 2;
    const idx = (a / (Math.PI * 2)) * BOUNDARY_STEPS;
    const i0 = Math.floor(idx) % BOUNDARY_STEPS;
    const i1 = (i0 + 1) % BOUNDARY_STEPS;
    const frac = idx - Math.floor(idx);
    return BOUNDARY_TABLE[i0] * (1 - frac) + BOUNDARY_TABLE[i1] * frac;
  }

  // --- Particle field ---
  let particles = [];
  function buildParticles() {
    const count = Math.max(900, Math.min(3400, Math.floor((W * H) / (620 * DPR))));
    particles = [];
    for (let i = 0; i < count; i++) particles.push(makeParticle());
  }
  function makeParticle() {
    const { minX, maxX, minY, maxY } = HEART_BOUNDS;
    let lx = 0, ly = 0;
    for (let tries = 0; tries < 40; tries++) {
      const rx = minX + Math.random() * (maxX - minX);
      const ry = minY + Math.random() * (maxY - minY);
      if (pointInHeart(rx, ry)) { lx = rx; ly = ry; break; }
    }
    const isSpark = Math.random() < 0.06;
    return {
      homeX: lx, homeY: ly,
      x: centerX + lx * heartScale, y: centerY + ly * heartScale,
      vx: 0, vy: 0,
      r: (isSpark ? 2.1 + Math.random() * 1.1 : 0.9 + Math.random() * 1.5) * DPR,
      c: isSpark ? 2 : (Math.random() < 0.5 ? 0 : 1),
      phase: Math.random() * Math.PI * 2,
      wobble: 0.4 + Math.random() * 0.8,
      ox: null, oy: null,            // optional target (digit / greeting), offset from centre
      free: false, a: 1,             // free = flying as firework debris; a = opacity
      life: 0, maxLife: 1
    };
  }

  // --- Color themes: right-click cycles between them, colors cross-fade ---
  function rgbStr(c, a) { return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }
  function lerpRGB(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  const THEMES = [
    { // Đỏ cổ điển
      bgInner: [23, 10, 12], bgOuter: [10, 4, 5],
      colors: [[180, 18, 58], [255, 45, 85], [255, 179, 193]],
      glow: [255, 45, 85], streak: [255, 225, 230],
      burst: [[255, 59, 92], [255, 143, 168]]
    },
    { // Hồng pastel
      bgInner: [26, 15, 21], bgOuter: [13, 7, 11],
      colors: [[201, 110, 140], [255, 150, 181], [255, 219, 232]],
      glow: [255, 150, 181], streak: [255, 238, 244],
      burst: [[255, 150, 181], [255, 219, 232]]
    },
    { // Vàng gold
      bgInner: [24, 16, 7], bgOuter: [11, 7, 3],
      colors: [[163, 110, 20], [255, 183, 59], [255, 227, 158]],
      glow: [255, 183, 59], streak: [255, 241, 214],
      burst: [[255, 183, 59], [255, 227, 158]]
    },
    { // Xanh neon
      bgInner: [7, 13, 27], bgOuter: [3, 6, 13],
      colors: [[30, 90, 180], [64, 190, 255], [186, 236, 255]],
      glow: [64, 190, 255], streak: [222, 246, 255],
      burst: [[64, 190, 255], [186, 236, 255]]
    }
  ];
  let themeIndex = 0;
  let themeFrom = THEMES[0], themeT = 1;
  function lerpTheme(a, b, t) {
    return {
      bgInner: lerpRGB(a.bgInner, b.bgInner, t),
      bgOuter: lerpRGB(a.bgOuter, b.bgOuter, t),
      colors: a.colors.map((c, i) => lerpRGB(c, b.colors[i], t)),
      glow: lerpRGB(a.glow, b.glow, t),
      streak: lerpRGB(a.streak, b.streak, t),
      burst: a.burst.map((c, i) => lerpRGB(c, b.burst[i], t))
    };
  }
  function currentTheme() {
    return themeT >= 1 ? THEMES[themeIndex] : lerpTheme(themeFrom, THEMES[themeIndex], themeT);
  }
  function cycleTheme() {
    themeFrom = currentTheme();
    themeIndex = (themeIndex + 1) % THEMES.length;
    themeT = 0;
  }
  window.addEventListener('contextmenu', (e) => { e.preventDefault(); cycleTheme(); });

  // --- Mini hearts: click bursts and a drag-painted trail, sharing one pool ---
  let bursts = [];
  function heartPathAt(cx, cy, size, rot) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.beginPath();
    for (let i = 0; i <= 60; i++) {
      const t = (i / 60) * Math.PI * 2;
      const [x, y] = heartLocal(t, 1);
      const px = x * size, py = y * size;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.restore();
  }

  function spawnBurst(x, y) {
    const theme = currentTheme();
    const n = 4 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) {
      const ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.4;
      const speed = (1.1 + Math.random() * 1.3) * DPR;
      bursts.push({
        x: x + (Math.random() - 0.5) * 14 * DPR,
        y: y + (Math.random() - 0.5) * 14 * DPR,
        vx: Math.cos(ang) * speed,
        vy: Math.sin(ang) * speed,
        size: (5 + Math.random() * 7) * DPR,
        rot: (Math.random() - 0.5) * 0.6,
        vrot: (Math.random() - 0.5) * 0.02,
        life: 0,
        maxLife: 1.6 + Math.random() * 0.8,
        hue: rgbStr(theme.burst[Math.random() < 0.5 ? 0 : 1], 1)
      });
    }
  }

  function spawnTrailHeart(x, y) {
    const theme = currentTheme();
    bursts.push({
      x: x + (Math.random() - 0.5) * 6 * DPR,
      y: y + (Math.random() - 0.5) * 6 * DPR,
      vx: (Math.random() - 0.5) * 0.3 * DPR,
      vy: -(0.15 + Math.random() * 0.2) * DPR,
      size: (4 + Math.random() * 4) * DPR,
      rot: (Math.random() - 0.5) * 0.5,
      vrot: (Math.random() - 0.5) * 0.015,
      life: 0,
      maxLife: 1.1 + Math.random() * 0.6,
      hue: rgbStr(theme.burst[Math.random() < 0.5 ? 0 : 1], 1)
    });
  }

  // --- Faint static starfield filling the empty background ---
  let stars = [];
  function buildStars() {
    const count = Math.min(130, Math.max(70, Math.round((W * H) / (800000 * DPR))));
    stars = [];
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: (0.6 + Math.random() * 1.1) * DPR,
        phase: Math.random() * Math.PI * 2,
        speed: 0.4 + Math.random() * 0.6,
        baseAlpha: 0.12 + Math.random() * 0.28
      });
    }
  }
  function drawStars(theme, elapsed) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const s of stars) {
      const twinkle = reduceMotion ? 1 : (0.6 + 0.4 * Math.sin(elapsed * s.speed + s.phase));
      ctx.beginPath();
      ctx.fillStyle = rgbStr(theme.streak, s.baseAlpha * twinkle);
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // --- Shooting stars, drifting across the background ---
  let shootingStars = [];
  let starTimer = 0;
  let nextStarAt = 1.5 + Math.random() * 2.5;

  function spawnShootingStar() {
    const fromLeft = Math.random() < 0.5;
    const dirX = fromLeft ? 1 : -1;
    const angle = (16 + Math.random() * 16) * Math.PI / 180;
    const speed = (6.5 + Math.random() * 3) * DPR;
    shootingStars.push({
      x: fromLeft ? -60 * DPR : W + 60 * DPR,
      y: (0.04 + Math.random() * 0.4) * H,
      vx: dirX * Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: (6 + Math.random() * 5) * DPR,
      trail: []
    });
  }

  function updateAndDrawShootingStars(dt, theme) {
    if (reduceMotion) return;
    starTimer += dt;
    if (starTimer > nextStarAt && shootingStars.length < (starRate > 1.5 ? 4 : 2)) {
      spawnShootingStar();
      starTimer = 0;
      nextStarAt = (3.5 + Math.random() * 5) / starRate;
    }

    for (let i = shootingStars.length - 1; i >= 0; i--) {
      const s = shootingStars[i];
      s.trail.push({ x: s.x, y: s.y });
      if (s.trail.length > 16) s.trail.shift();
      s.x += s.vx;
      s.y += s.vy;
      if (s.x < -120 * DPR || s.x > W + 120 * DPR || s.y > H + 120 * DPR) {
        shootingStars.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let k = 0; k < s.trail.length; k++) {
        const pt = s.trail[k];
        const frac = k / s.trail.length;
        ctx.beginPath();
        ctx.fillStyle = rgbStr(theme.glow, frac * 0.45);
        ctx.arc(pt.x, pt.y, s.size * 0.16 * frac + 0.3 * DPR, 0, Math.PI * 2);
        ctx.fill();
      }
      const glowR = s.size * 2.4;
      const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, glowR);
      glow.addColorStop(0, rgbStr(theme.glow, 0.55));
      glow.addColorStop(1, rgbStr(theme.glow, 0));
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(s.x, s.y, glowR, 0, Math.PI * 2);
      ctx.fill();

      const ang = Math.atan2(s.vy, s.vx);
      const streakLen = s.size * 3.4;
      const tailX = s.x - Math.cos(ang) * streakLen;
      const tailY = s.y - Math.sin(ang) * streakLen;
      const streak = ctx.createLinearGradient(tailX, tailY, s.x, s.y);
      streak.addColorStop(0, rgbStr(theme.streak, 0));
      streak.addColorStop(1, rgbStr(theme.streak, 0.9));
      ctx.strokeStyle = streak;
      ctx.lineWidth = s.size * 0.3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tailX, tailY);
      ctx.lineTo(s.x, s.y);
      ctx.stroke();

      ctx.beginPath();
      ctx.fillStyle = rgbStr(theme.streak, 1);
      ctx.arc(s.x, s.y, s.size * 0.22, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // --- Parallax echo layers behind the main heart, for depth ---
  let parallaxX = 0, parallaxY = 0;
  function drawParallaxLayer(theme, pulse, elapsed, scaleMul, alpha, driftAmp, phase, mouseFactor) {
    const driftX = reduceMotion ? 0 : Math.sin(elapsed * 0.15 + phase) * driftAmp * DPR;
    const driftY = reduceMotion ? 0 : Math.cos(elapsed * 0.12 + phase) * driftAmp * DPR * 0.6;
    const cx = centerX + driftX + parallaxX * mouseFactor;
    const cy = centerY + driftY + parallaxY * mouseFactor;
    const layerPulse = 1 + (pulse - 1) * 0.4;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = alpha;
    ctx.fillStyle = rgbStr(theme.colors[0], 1);
    heartPathAt(cx, cy, heartScale * scaleMul * layerPulse, 0);
    ctx.fill();
    ctx.restore();
  }

  // --- Mouse / touch state (drag paints a trail, holding still shatters the heart) ---
  const pointer = { x: -9999, y: -9999, active: false };
  let isDragging = false;
  let lastTrailPos = null;

  function setPointer(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    pointer.x = (clientX - rect.left) * DPR;
    pointer.y = (clientY - rect.top) * DPR;
    pointer.active = true;
  }
  function trySpawnTrail(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * DPR, y = (clientY - rect.top) * DPR;
    if (lastTrailPos) {
      const dx = x - lastTrailPos.x, dy = y - lastTrailPos.y;
      if (Math.sqrt(dx * dx + dy * dy) < 14 * DPR) return;
    }
    lastTrailPos = { x, y };
    spawnTrailHeart(x, y);
  }

  window.addEventListener('mousemove', (e) => {
    setPointer(e.clientX, e.clientY);
    if (isDragging) trySpawnTrail(e.clientX, e.clientY);
  });
  window.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    isDragging = true;
    lastTrailPos = null;
  });
  window.addEventListener('mouseup', () => { isDragging = false; lastTrailPos = null; });
  window.addEventListener('mouseleave', () => { pointer.active = false; isDragging = false; lastTrailPos = null; });
  window.addEventListener('click', (e) => pointerAction(e.clientX * DPR, e.clientY * DPR));
  window.addEventListener('touchmove', (e) => {
    if (e.touches[0]) {
      setPointer(e.touches[0].clientX, e.touches[0].clientY);
      if (isDragging) trySpawnTrail(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });
  window.addEventListener('touchstart', (e) => {
    if (e.touches[0]) {
      isDragging = true;
      lastTrailPos = null;
      setPointer(e.touches[0].clientX, e.touches[0].clientY);
      pointerAction(e.touches[0].clientX * DPR, e.touches[0].clientY * DPR);
    }
  }, { passive: true });
  window.addEventListener('touchend', () => { isDragging = false; lastTrailPos = null; pointer.active = false; });

  // ===================== Birthday sequence =====================
  // idle -> countdown (10..1, digits drawn by the particles) -> boom (heart compresses, explodes,
  // fireworks) -> celebrate (particles spell the greeting). The twinkling heart button starts it.
  const GREETING = 'Chúc mừng sinh nhật vợ yêu';
  const FONT_FAMILY = '"Inter", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
  const GREET_FONT = '"Dancing Script", "Segoe Script", "Brush Script MT", cursive';
  const GREET_WEIGHT = 700;
  const COUNT_FROM = 10;
  const BOOM_FUSE = 0.8;     // seconds the heart spends compressing before it explodes
  const TEXT_AT = 3.2;       // seconds after the explosion before the particles spell the greeting
  const MAX_SPARKS = 2200;

  const startBtn = document.getElementById('start');
  let state = 'idle';
  let stateT = 0, countNum = COUNT_FROM, countTimer = 0, celebrateT = 0;
  let exploded = false, rocketTimer = 0, flash = 0, starRate = 1;
  let beatPhase = 0, beatCycle = 1.05;
  let btnAlpha = 1, btnLive = true;
  let rockets = [], sparks = [], shocks = [];
  let targetCache = {};

  const easeInOut = (t) => t * t * (3 - 2 * t);
  const easeOut = (t) => 1 - (1 - t) * (1 - t);
  function setState(s) { state = s; stateT = 0; }

  // Renders text offscreen and samples it into ~one point per particle (device px, relative to
  // the screen centre), so the existing spring physics can pull the particles into the glyphs.
  function textTargets(lines, fontPx, family = FONT_FAMILY, weight = 800) {
    const c = document.createElement('canvas');
    const g = c.getContext('2d');
    const font = `${weight} ${Math.round(fontPx)}px ${family}`;
    g.font = font;
    let maxW = 0;
    for (const l of lines) maxW = Math.max(maxW, g.measureText(l).width);
    const lineH = fontPx * 1.25;
    const cw = Math.ceil(maxW + fontPx * 0.5);
    const ch = Math.ceil(lineH * lines.length + fontPx * 0.5);
    c.width = cw;
    c.height = ch;
    g.font = font;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = '#fff';
    lines.forEach((l, i) => g.fillText(l, cw / 2, ch / 2 + (i - (lines.length - 1) / 2) * lineH));
    const data = g.getImageData(0, 0, cw, ch).data;

    let covered = 0, minX = cw, maxX = 0, minY = ch, maxY = 0;
    for (let y = 0; y < ch; y++) {
      for (let x = 0; x < cw; x++) {
        if (data[(y * cw + x) * 4 + 3] > 128) {
          covered++;
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (!covered) return [];
    const midX = (minX + maxX) / 2, midY = (minY + maxY) / 2;
    const step = Math.max(1, Math.sqrt(covered / Math.max(1, particles.length)));
    const pts = [];
    for (let y = minY; y <= maxY; y += step) {
      for (let x = minX; x <= maxX; x += step) {
        const px = Math.min(cw - 1, Math.floor(x + Math.random() * step));
        const py = Math.min(ch - 1, Math.floor(y + Math.random() * step));
        if (data[(py * cw + px) * 4 + 3] > 128) pts.push([px - midX, py - midY]);
      }
    }
    for (let i = pts.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = pts[i]; pts[i] = pts[j]; pts[j] = t;
    }
    // Offset of the canvas centre from the glyph box centre: lets real text line up with the points.
    pts.cx = cw / 2 - midX;
    pts.cy = ch / 2 - midY;
    return pts;
  }

  function numberTargets(n) {
    const key = 'n' + n;
    return targetCache[key] || (targetCache[key] = textTargets([String(n)], Math.min(H * 0.62, W * 0.46)));
  }

  function greetingTargets() {
    if (targetCache.greet) return targetCache.greet;
    const probe = document.createElement('canvas').getContext('2d');
    probe.font = `${GREET_WEIGHT} 100px ${GREET_FONT}`;
    let lines = [GREETING];
    let fontPx = Math.min(W * 0.88 / probe.measureText(GREETING).width * 100, H * 0.2);
    if (fontPx < 44 * DPR) { // narrow screens: split into lines so the text can be bigger
      lines = ['Chúc mừng sinh nhật', 'vợ yêu'];
      let wMax = Math.max(...lines.map((l) => probe.measureText(l).width));
      fontPx = Math.min(W * 0.86 / wMax * 100, H * 0.14);
      if (fontPx < 60 * DPR) {
        lines = ['Chúc mừng', 'sinh nhật', 'vợ yêu'];
        wMax = Math.max(...lines.map((l) => probe.measureText(l).width));
        fontPx = Math.min(W * 0.86 / wMax * 100, H * 0.1);
      }
    }
    targetCache.greetLayout = { lines, fontPx };
    return (targetCache.greet = textTargets(lines, fontPx, GREET_FONT, GREET_WEIGHT));
  }

  // The greeting itself: real glowing text laid exactly over the points the particles settle on.
  let greetAlpha = 0;
  function drawGreeting(theme, pulse, dt) {
    const target = state === 'celebrate' ? easeInOut(Math.min(1, Math.max(0, (celebrateT - 1.6) / 1.2))) : 0;
    greetAlpha += (target - greetAlpha) * Math.min(1, dt * (target > greetAlpha ? 8 : 5));
    const pts = targetCache.greet, lay = targetCache.greetLayout;
    if (greetAlpha < 0.01 || !pts || !lay) return;
    const s = 1 + (pulse - 1) * 0.35;
    const lineH = lay.fontPx * 1.25;
    const n = lay.lines.length;
    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.scale(s, s);
    ctx.font = `${GREET_WEIGHT} ${Math.round(lay.fontPx)}px ${GREET_FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = greetAlpha;
    ctx.fillStyle = rgbStr(theme.streak, 1);
    ctx.shadowColor = rgbStr(theme.glow, 0.95);
    ctx.shadowBlur = (16 + (pulse - 1) * 120) * DPR;
    lay.lines.forEach((l, i) => ctx.fillText(l, pts.cx, pts.cy + (i - (n - 1) / 2) * lineH));
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';
    lay.lines.forEach((l, i) => ctx.fillText(l, pts.cx, pts.cy + (i - (n - 1) / 2) * lineH));
    ctx.restore();
  }

  // Make sure the embedded font is ready before any text is measured or sampled.
  if (document.fonts && document.fonts.load) {
    document.fonts.load(`${GREET_WEIGHT} 64px "Dancing Script"`, GREETING).then(() => {
      if (state === 'idle' || state === 'countdown') delete targetCache.greet;
    }).catch(() => {});
  }

  function assignTargets(pts) {
    if (!pts.length) return;
    for (let i = 0; i < particles.length; i++) {
      const q = pts[i % pts.length];
      particles[i].ox = q[0];
      particles[i].oy = q[1];
    }
  }

  function showNumber(n, burst) {
    assignTargets(numberTargets(n));
    beatPhase = 0; // land a heartbeat exactly on the tick
    if (!burst || reduceMotion) return;
    for (const p of particles) {
      const ang = Math.atan2(p.y - centerY, p.x - centerX) + (Math.random() - 0.5) * 0.8;
      const sp = (1.5 + Math.random() * 3.5) * DPR;
      p.vx += Math.cos(ang) * sp;
      p.vy += Math.sin(ang) * sp;
    }
    shocks.push({ x: centerX, y: centerY, life: 0, max: 0.8, r0: heartScale * 3, r1: heartScale * 15 });
  }

  function beginSequence() {
    if (state !== 'idle' && state !== 'celebrate') return;
    setState('countdown');
    countNum = COUNT_FROM;
    countTimer = 0;
    exploded = false;
    celebrateT = 0;
    for (const p of particles) { p.free = false; p.a = 1; }
    showNumber(countNum, true);
  }

  function startBoom() {
    setState('boom');
    exploded = false;
    for (const p of particles) { p.ox = null; p.oy = null; }
  }

  function explode() {
    exploded = true;
    flash = reduceMotion ? 0 : 1;
    rocketTimer = 0.15;
    for (const p of particles) {
      const ang = Math.atan2(p.y - centerY, p.x - centerX) + (Math.random() - 0.5) * 1.1;
      const sp = (2.5 + Math.random() * 10) * DPR * (reduceMotion ? 0.5 : 1);
      p.vx = Math.cos(ang) * sp;
      p.vy = Math.sin(ang) * sp - 1.2 * DPR;
      p.free = true;
      p.life = 0;
      p.maxLife = 1.6 + Math.random() * 1.6;
    }
    shocks.push({ x: centerX, y: centerY, life: 0, max: 0.9, r0: heartScale * 2, r1: heartScale * 24 });
    spawnExplosion(centerX, centerY, themeIndex, true);
    launchRocket();
    launchRocket();
  }

  function growForGreeting() {
    const want = Math.min(6500, Math.floor(particles.length * 2.2));
    while (particles.length < want) {
      const p = makeParticle();
      p.a = 0;
      particles.push(p);
    }
  }

  function startCelebrate() {
    setState('celebrate');
    celebrateT = 0;
    for (const p of particles) { p.free = false; p.a = 0; p.vx = 0; p.vy = 0; }
    growForGreeting();
    assignTargets(greetingTargets());
  }

  // Rockets rise with a trail and burst at their apex; some bursts are hearts.
  function launchRocket() {
    if (rockets.length >= 10) return;
    const g = 0.12 * DPR;
    const rise = H * (0.45 + Math.random() * 0.4);
    rockets.push({
      x: W * (0.12 + Math.random() * 0.76),
      y: H + 8 * DPR,
      vx: (Math.random() - 0.5) * 0.6 * DPR,
      vy: -Math.sqrt(2 * g * rise),
      g,
      trail: [],
      theme: Math.floor(Math.random() * THEMES.length),
      heart: Math.random() < 0.35
    });
  }

  function spawnExplosion(x, y, themeIdx, heart) {
    const th = THEMES[themeIdx];
    const sc = Math.max(0.65, Math.min(1.4, Math.min(W, H) / DPR / 700));
    const n = heart ? 84 : 70 + Math.floor(Math.random() * 40);
    for (let i = 0; i < n && sparks.length < MAX_SPARKS; i++) {
      let vx, vy;
      if (heart) {
        const [hx, hy] = heartLocal((i / n) * Math.PI * 2, 1);
        const k = 0.3 * DPR * sc * (0.96 + Math.random() * 0.08);
        vx = hx * k;
        vy = hy * k;
      } else {
        const a = Math.random() * Math.PI * 2;
        const sp = (Math.random() < 0.7 ? 4.6 + Math.random() * 1.2 : 1 + Math.random() * 3.4) * DPR * sc;
        vx = Math.cos(a) * sp;
        vy = Math.sin(a) * sp;
      }
      sparks.push({
        x, y, vx, vy,
        life: 0,
        maxLife: 1.3 + Math.random() * 0.9,
        r: (1.1 + Math.random() * 1.3) * DPR,
        c: Math.random() < 0.15 ? th.streak : th.burst[Math.random() < 0.5 ? 0 : 1]
      });
    }
  }

  function runRockets(dt, dense) {
    rocketTimer -= dt;
    if (rocketTimer > 0) return;
    launchRocket();
    rocketTimer = (dense ? 0.3 + Math.random() * 0.35 : 1.6 + Math.random() * 1.6) * (reduceMotion ? 2.5 : 1);
  }

  function updateSequence(dt) {
    stateT += dt;
    let cycleTarget = 1.05;
    if (state === 'countdown') {
      countTimer += dt;
      const progress = Math.min(1, (COUNT_FROM - countNum + countTimer) / COUNT_FROM);
      cycleTarget = 1.05 - 0.65 * progress; // heart beats faster as zero approaches
      starRate = 1 + 3 * progress;
      if (countTimer >= 1) {
        countTimer -= 1;
        countNum--;
        if (countNum > 0) showNumber(countNum, true); else startBoom();
      }
    } else if (state === 'boom') {
      cycleTarget = 0.3;
      starRate = 3;
      if (!exploded && stateT >= BOOM_FUSE) explode();
      if (exploded) {
        runRockets(dt, true);
        if (stateT >= BOOM_FUSE + TEXT_AT) startCelebrate();
      }
    } else if (state === 'celebrate') {
      celebrateT += dt;
      cycleTarget = 1.0;
      starRate = 2;
      runRockets(dt, celebrateT < 3);
    } else {
      starRate = 1;
    }
    beatCycle += (cycleTarget - beatCycle) * Math.min(1, dt * 4);
    beatPhase += dt / beatCycle;
  }

  function updateFireworks(dt, theme) {
    const dtf = dt * 60;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    for (let i = shocks.length - 1; i >= 0; i--) {
      const s = shocks[i];
      s.life += dt;
      const t = s.life / s.max;
      if (t >= 1) { shocks.splice(i, 1); continue; }
      ctx.strokeStyle = rgbStr(theme.glow, 0.55 * (1 - t));
      ctx.lineWidth = (1 + 3 * (1 - t)) * DPR;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r0 + (s.r1 - s.r0) * easeOut(t), 0, Math.PI * 2);
      ctx.stroke();
    }

    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.trail.push({ x: r.x, y: r.y });
      if (r.trail.length > 14) r.trail.shift();
      r.x += r.vx * dtf;
      r.y += r.vy * dtf;
      r.vy += r.g * dtf;
      if (r.vy > -0.8 * DPR || r.y < H * 0.08) {
        spawnExplosion(r.x, r.y, r.theme, r.heart);
        rockets.splice(i, 1);
        continue;
      }
      const col = THEMES[r.theme].streak;
      for (let k = 0; k < r.trail.length; k++) {
        const f = k / r.trail.length;
        ctx.fillStyle = rgbStr(col, f * 0.6);
        ctx.beginPath();
        ctx.arc(r.trail[k].x, r.trail[k].y, (0.6 + f * 1.2) * DPR, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = rgbStr(col, 1);
      ctx.beginPath();
      ctx.arc(r.x, r.y, 2 * DPR, 0, Math.PI * 2);
      ctx.fill();
    }

    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.life += dt;
      if (s.life >= s.maxLife) { sparks[i] = sparks[sparks.length - 1]; sparks.pop(); continue; }
      const drag = 1 - 0.028 * dtf;
      s.vx *= drag;
      s.vy = s.vy * drag + 0.022 * DPR * dtf;
      s.x += s.vx * dtf;
      s.y += s.vy * dtf;
      const t = s.life / s.maxLife;
      ctx.fillStyle = rgbStr(s.c, (1 - t) * (0.65 + 0.35 * Math.random()));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * (1 - t * 0.5), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // The little heart in the top-right corner, twinkling like the stars. The real <button> on top
  // of it only provides the hit area, keyboard access and the accessible name.
  function drawStartButton(theme, elapsed, dt) {
    const target = (state === 'idle' || (state === 'celebrate' && celebrateT > 2.2)) ? 1 : 0;
    btnAlpha += (target - btnAlpha) * Math.min(1, dt * 5);
    const live = target === 1;
    if (live !== btnLive) {
      btnLive = live;
      startBtn.style.pointerEvents = live ? 'auto' : 'none';
      startBtn.tabIndex = live ? 0 : -1;
    }
    if (btnAlpha < 0.01) return;

    const cx = W - 38 * DPR, cy = 38 * DPR;
    const tw = reduceMotion ? 1 : 0.55 + 0.45 * Math.sin(elapsed * 2.1 + 1.3);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = btnAlpha;

    const glowR = 24 * DPR;
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
    glow.addColorStop(0, rgbStr(theme.glow, 0.4 * tw));
    glow.addColorStop(1, rgbStr(theme.glow, 0));
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, glowR, 0, Math.PI * 2);
    ctx.fill();

    const ray = (9 + 6 * tw) * DPR;
    ctx.strokeStyle = rgbStr(theme.streak, 0.7 * tw);
    ctx.lineWidth = 1 * DPR;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - ray, cy); ctx.lineTo(cx + ray, cy);
    ctx.moveTo(cx, cy - ray); ctx.lineTo(cx, cy + ray);
    ctx.stroke();

    ctx.fillStyle = rgbStr(theme.colors[2], 0.55 + 0.45 * tw);
    heartPathAt(cx, cy, 0.5 * DPR * (0.92 + 0.1 * tw), 0);
    ctx.fill();
    ctx.restore();
  }

  function pointerAction(x, y) {
    if (state === 'idle') spawnBurst(x, y);
    else if (state === 'celebrate') spawnExplosion(x, y, Math.floor(Math.random() * THEMES.length), Math.random() < 0.4);
  }
  startBtn.addEventListener('click', (e) => { e.stopPropagation(); beginSequence(); });
  startBtn.addEventListener('mousedown', (e) => e.stopPropagation());
  startBtn.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });

  // Rebuilt particles (after a resize) lose their targets, so restore them for the current state.
  function reapplySequence() {
    targetCache = {};
    if (state === 'countdown') {
      showNumber(countNum, false);
    } else if (state === 'boom' || state === 'celebrate') {
      rockets = []; sparks = []; shocks = [];
      if (state === 'boom') { setState('celebrate'); celebrateT = 0; }
      growForGreeting();
      assignTargets(greetingTargets());
    }
  }

  // --- Sizing ---
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width = Math.floor(window.innerWidth * DPR);
    H = canvas.height = Math.floor(window.innerHeight * DPR);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    centerX = W / 2;
    centerY = H / 2;
    heartScale = Math.min(W, H) / 34;
    buildParticles();
    buildStars();
    reapplySequence();
  }
  window.addEventListener('resize', resize);
  resize();

  // --- Heartbeat rhythm: two pulses ("lub-dub") per cycle ---
  function beatPulse(beat) {
    if (reduceMotion) return 1;
    const phase = beat - Math.floor(beat);
    const bump = (center, width, amp) => amp * Math.exp(-Math.pow((phase - center) / width, 2));
    return 1 + bump(0.05, 0.05, 0.085) + bump(0.24, 0.07, 0.045);
  }

  // --- Hold the cursor still on the heart to shatter nearby particles; they spring back on their own ---
  let holdAnchor = null, holdTime = 0, lastShatterAt = -999;
  function shatterNear(x, y) {
    const radius = heartScale * 9;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const dx = p.x - x, dy = p.y - y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < radius) {
        const falloff = 1 - dist / radius;
        const ang = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.6;
        const power = (3 + Math.random() * 5) * falloff * DPR;
        p.vx += Math.cos(ang) * power;
        p.vy += Math.sin(ang) * power;
      }
    }
  }

  // --- Main loop ---
  let last = performance.now();
  let elapsed = 0;
  const CURSOR_HOLE_SCALE = () => 5 * DPR;
  const SPRING_K = 0.055;
  const DAMPING = 0.82;

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    elapsed += dt;
    updateSequence(dt);

    const theme = currentTheme();
    if (themeT < 1) themeT = Math.min(1, themeT + dt / 0.8);

    ctx.clearRect(0, 0, W, H);

    // vignette ground
    const grd = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(W, H) * 0.75);
    grd.addColorStop(0, rgbStr(theme.bgInner, 1));
    grd.addColorStop(1, rgbStr(theme.bgOuter, 1));
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);

    if (flash > 0) {
      ctx.fillStyle = rgbStr(theme.streak, flash * 0.28);
      ctx.fillRect(0, 0, W, H);
      flash = Math.max(0, flash - dt * 2.2);
    }

    drawStars(theme, elapsed);

    const pulse = beatPulse(beatPhase);

    // ambient glow behind the heart, synced to the beat
    const glowR = heartScale * 15 * pulse;
    const glow = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, glowR);
    glow.addColorStop(0, rgbStr(theme.glow, 0.16));
    glow.addColorStop(0.6, rgbStr(theme.glow, 0.06));
    glow.addColorStop(1, rgbStr(theme.glow, 0));
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    // parallax echo layers (farthest first), gently trailing the cursor
    const targetParX = pointer.active ? (pointer.x - centerX) : 0;
    const targetParY = pointer.active ? (pointer.y - centerY) : 0;
    parallaxX += (targetParX - parallaxX) * 0.04;
    parallaxY += (targetParY - parallaxY) * 0.04;
    drawParallaxLayer(theme, pulse, elapsed, 1.44, 0.05, 10, 0, 0.015);
    drawParallaxLayer(theme, pulse, elapsed, 1.15, 0.08, 6, 2.1, 0.028);

    // shooting stars, behind the main particle heart
    updateAndDrawShootingStars(dt, theme);

    // holding the cursor still shatters nearby particles; the spring below reassembles them
    if (pointer.active) {
      if (!holdAnchor) {
        holdAnchor = { x: pointer.x, y: pointer.y };
        holdTime = 0;
      } else {
        const hdx = pointer.x - holdAnchor.x, hdy = pointer.y - holdAnchor.y;
        if (Math.sqrt(hdx * hdx + hdy * hdy) > 10 * DPR) {
          holdAnchor = { x: pointer.x, y: pointer.y };
          holdTime = 0;
        } else {
          holdTime += dt;
        }
      }
      if (holdTime > 1.0 && elapsed - lastShatterAt > 1.8) {
        shatterNear(pointer.x, pointer.y);
        lastShatterAt = elapsed;
      }
    } else {
      holdAnchor = null;
      holdTime = 0;
    }

    drawGreeting(theme, pulse, dt);

    // particles
    ctx.globalCompositeOperation = 'lighter';
    const holeScale = CURSOR_HOLE_SCALE();
    const heartMul = (state === 'boom' && !exploded) ? 1 - 0.45 * easeInOut(Math.min(1, stateT / BOOM_FUSE)) : 1;
    const textPulse = 1 + (pulse - 1) * (state === 'celebrate' ? 0.35 : 0.7);
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];

      if (p.free) { // firework debris from the explosion: ballistic, fading out
        p.life += dt;
        const fa = 1 - p.life / p.maxLife;
        p.vx *= 0.985;
        p.vy = p.vy * 0.985 + 0.045 * DPR;
        p.x += p.vx;
        p.y += p.vy;
        if (fa > 0) {
          ctx.beginPath();
          ctx.fillStyle = rgbStr(theme.colors[p.c], fa);
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
        continue;
      }

      const hasText = p.ox !== null;
      let tx, ty;
      if (hasText) {
        tx = centerX + p.ox * textPulse;
        ty = centerY + p.oy * textPulse;
      } else {
        tx = centerX + p.homeX * heartScale * pulse * heartMul;
        ty = centerY + p.homeY * heartScale * pulse * heartMul;
      }

      if (!reduceMotion) {
        const wob = (hasText ? 0.6 : 1.5) * DPR;
        tx += Math.sin(elapsed * p.wobble + p.phase) * wob;
        ty += Math.cos(elapsed * p.wobble * 0.8 + p.phase) * wob;
      }

      let ax = (tx - p.x) * SPRING_K;
      let ay = (ty - p.y) * SPRING_K;

      if (pointer.active) {
        const dx = p.x - pointer.x, dy = p.y - pointer.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 0.001;
        // The "hole" around the cursor follows the heart's own outline rather than a circle.
        const holeR = heartBoundaryRadius(Math.atan2(dy, dx)) * holeScale;
        if (dist < holeR) {
          const force = (1 - dist / holeR) * 6.5;
          ax += (dx / dist) * force;
          ay += (dy / dist) * force;
        }
      }

      p.vx = (p.vx + ax) * DAMPING;
      p.vy = (p.vy + ay) * DAMPING;
      p.x += p.vx;
      p.y += p.vy;

      if (p.a < 1) p.a = Math.min(1, p.a + dt * 1.1);
      ctx.beginPath();
      const inGreeting = state === 'celebrate' && hasText;
      ctx.fillStyle = rgbStr(theme.colors[p.c], inGreeting ? p.a * (1 - 0.65 * greetAlpha) : p.a);
      ctx.arc(p.x, p.y, inGreeting ? p.r * 0.72 : p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    updateFireworks(dt, theme);

    // flying / trail mini hearts
    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      b.life += dt;
      if (b.life >= b.maxLife) { bursts.splice(i, 1); continue; }
      b.x += b.vx;
      b.y += b.vy;
      b.vy -= 0.012 * DPR;
      b.vx *= 0.99;
      b.rot += b.vrot;
      const tlife = b.life / b.maxLife;
      const alpha = tlife < 0.15 ? tlife / 0.15 : 1 - (tlife - 0.15) / 0.85;

      ctx.globalAlpha = Math.max(0, alpha) * 0.9;
      ctx.fillStyle = b.hue;
      heartPathAt(b.x, b.y, b.size / 17, b.rot);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    drawStartButton(theme, elapsed, dt);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
